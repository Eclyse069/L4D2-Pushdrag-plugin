// ===========================================================================
// Push And Drag v2.4 —— 求生之路 1/2 抓取、拖动、投掷插件
// 配置文件：cfg/sourcemod/l4d_pushdrag.cfg
// 所有数值均为默认值；改完保存后换图生效，也可用 sm_cvar 即时修改。
//
// 按键：双击 R = 普通抓取（240）；按住 +speed 双击 R = 超远抓取（1000）；
//       持握中右键 = 投掷；持握中按住 +speed + 右键 = 大力投掷。
//       持握中单击 R = 放下；被抓玩家按空格 = 挣脱；按狙击瞄准键 = 回正（旁观者用 Ctrl）。
// 旁观者（team 1）：持握中按 E = 投掷；按住 +speed + E = 大力投掷（旁观时右键是切换观战）；
//       持握中按 F（手电筒 impulse 100）切换回正模式；Ctrl 也兼容；聊天框 !pdlevel 同样可以切换。
// 旁观者也可抓物件、生还者可抓敌方特感、Witch 可抓（能拖动/扔出）；均由下面的 cvar 控制。
// 投掷物伤害：生还者/旁观者投出的物件会伤到特感与普通感染者（系数见“五、投掷”）。
// 诊断命令：!pddebug = 开关诊断输出；!pdver = 查看版本/CancelStagger 是否就绪。
// 硬直取消依赖 gamedata/l4_pushdrag.txt（服务器 addons/sourcemod/gamedata/ 下）。
//
// 【中文注释说明】L4D2 自带的 cfg 解析器对非 ASCII 字符支持不佳，
// 个别环境下中文注释会在控制台刷 unknown command。如果遇到：
//   1) 启用 JS-MODS 里的「可选-修复类(修复CFG中文注释导致控制台刷屏的问题)」；或
//   2) 用桌面上的英文备用文件 l4d_pushdrag_english.cfg 覆盖本文件。
// ===========================================================================


// ---------------------------------------------------------------------------
// 一、总开关与模式
// ---------------------------------------------------------------------------

// 总开关：0 = 关闭插件并立刻释放所有持握；1 = 开启
l4d_pushdrag_enable "1"

// 对抗/清道夫模式下的生还者：0=禁用 1=只能抓物件 2=只能抓队友 3=物件和队友都能抓
l4d_pushdrag_versus_survivor "3"

// 对抗/清道夫模式下的感染者：0=禁用 1=只能抓物件 2=只能抓队友 3=物件和队友都能抓
l4d_pushdrag_versus_infected "2"

// 是否允许抓玩家：1=允许；0=完全禁止（合作模式也受此限制）
l4d_pushdrag_player_grab "1"

// 是否允许旁观者（team 1）抓取物件：1=允许；0=禁止
l4d_pushdrag_spectator_grab "1"

// 旁观者是否也可以抓玩家/特感：1=允许；0=只能抓物件
l4d_pushdrag_spectator_grab_players "1"

// 是否允许生还者抓敌方特感（含 Tank）：1=允许；0=禁止
l4d_pushdrag_survivor_grab_special "1"

// 抓取总功能仅管理员可用：1=仅管理员；0=所有人（权限名 sm_pushdrag_admin，默认 generic）
l4d_pushdrag_admin_only "0"

// 抓特感仅管理员可用：1=仅管理员；0=所有人
l4d_pushdrag_admin_only_special "1"

// 旁观者抓取仅管理员可用：1=仅管理员；0=所有人
l4d_pushdrag_admin_only_spectator "1"

// 超远距离抓取（+speed 双击 R）仅管理员可用：1=仅管理员；0=所有人（非管理员按普通距离抓取）
l4d_pushdrag_admin_only_far_grab "0"

// 大力投掷（+speed + 投掷键）仅管理员可用：1=仅管理员；0=所有人（非管理员按普通力度投掷）
l4d_pushdrag_admin_only_strong_throw "0"

// 被特感控制时禁止抓取/拖拽（Hunter 扑、Smoker 拉、Jockey 骑、Charger 撞）：1=禁止；0=允许
l4d_pushdrag_block_when_controlled "1"


// ---------------------------------------------------------------------------
// 二、抓取距离（单位：游戏单位，约 16 单位 ≈ 0.3 米）
// ---------------------------------------------------------------------------

// 能抓到东西的最大距离
l4d_pushdrag_grab_range "240.0"

// 按住 +speed 双击 R 的“超远距离抓取”最大距离（默认 1000）
l4d_pushdrag_far_grab_range "1000.0"

// prop_* 物件被拖动时悬停在身前的距离
l4d_pushdrag_hold_dist_object "120.0"

// 名称里带 car 的实体（车辆类）的悬停距离
l4d_pushdrag_hold_dist_car "200.0"

// weapon_* 武器的悬停距离
l4d_pushdrag_hold_dist_weapon "50.0"

// 被抓玩家的悬停距离
l4d_pushdrag_hold_dist_player "70.0"

// 其他没匹配上的实体使用的默认距离（Witch 也使用这个距离）
l4d_pushdrag_hold_dist_default "100.0"

// 生还者抓敌方特感时的悬停距离（默认 180，避免贴脸进入特感攻击范围）
l4d_pushdrag_hold_dist_special "180.0"


// ---------------------------------------------------------------------------
// 三、最长持握时间（单位：秒，到时间自动松手）
// ---------------------------------------------------------------------------

// prop_* 物件
l4d_pushdrag_hold_time_object "15.0"

// 车辆类实体
l4d_pushdrag_hold_time_car "10.0"

// weapon_* 武器
l4d_pushdrag_hold_time_weapon "30.0"

// 玩家
l4d_pushdrag_hold_time_player "15.0"

// 其他实体的默认值
l4d_pushdrag_hold_time_default "10.0"


// ---------------------------------------------------------------------------
// 四、持握物理（重力手感相关，改动前建议先备份）
// ---------------------------------------------------------------------------

// 拉力系数：速度 = 系数 × 距离²；越大吸得越快越猛
l4d_pushdrag_hold_force "0.2"

// 计算拉力时的距离截断，防止超远距离产生过大的力
l4d_pushdrag_hold_force_dist "100.0"

// 物件被拖动时的最大速度（防止穿墙/乱飞）
l4d_pushdrag_hold_max_speed "2000.0"

// 玩家与目标的距离超过这个值就自动松手（防止隔图甩物件）
l4d_pushdrag_break_dist "350.0"

// 松手时把插件写入的人工速度清零，物件立刻恢复正常落地（修复重力异常）
// 1 = 修复后的行为；0 = 旧行为（保留最后速度，可能继续飞）
l4d_pushdrag_release_stop "1"

// 按玩家移动速度外推持握点的延迟补偿系数；0 = 关闭
l4d_pushdrag_latency_comp "4.0"


// ---------------------------------------------------------------------------
// 五、投掷
// ---------------------------------------------------------------------------

// 按住 +speed（默认 Shift）单击右键的“大力投掷”力度
l4d_pushdrag_throw_force "2000.0"

// 右键（+attack2）投掷的力度
l4d_pushdrag_throw_force_attack2 "200.0"

// 距离最远时仍附加的最小投掷力
l4d_pushdrag_throw_force_base "200.0"

// 投掷力随距离衰减的参考距离
l4d_pushdrag_throw_falloff_dist "1000.0"

// 生还者/旁观者投出的物件撞到特感/普通感染者时的额外伤害系数：伤害 = 物件速度 × 系数（0=关闭；0.05 时 1000 速约 50 伤害；低速投掷伤害低）
l4d_pushdrag_thrown_prop_damage_scale "0.05"

// 生还者抓取并投出敌方特感时，该特感落地摔伤系数：伤害 = 投掷力 × 系数（0=关闭；0.02 时 2000 力约 40 伤害）
l4d_pushdrag_thrown_si_fall_damage_scale "0.02"


// ---------------------------------------------------------------------------
// 六、输入与杂项
// ---------------------------------------------------------------------------

// 双击 R 的判定窗口（秒，普通抓取与超远抓取共用）
l4d_pushdrag_double_tap_time "0.3"

// 是否把物理击杀归属写到物件上（m_hPhysicsAttacker / m_hLastAttacker）：1=写引擎字段；0=不写
// 无论填 0 还是 1，插件都会在 OnTakeDamage 里把投掷物的击杀记到投掷者头上
l4d_pushdrag_physics_attacker "1"

// 投掷后保留物理归属/击杀归属的秒数（引擎判定窗口为 5 秒；0=关闭归属）
l4d_pushdrag_attacker_time "5.0"

// 放下物件时清角速度并重新同步物理位置，避免休眠物件带旧状态（1=开；0=旧行为）
l4d_pushdrag_release_settle "1"

// 被抓的玩家按空格可挣脱：1=允许；0=禁止
l4d_pushdrag_player_jump_escape "1"

// 持握中的物件碰到玩家不造成伤害，抛出后恢复正常：1=开；0=关
l4d_pushdrag_no_held_damage "1"

// 放下玩家后免疫摔伤的秒数（0=关闭；默认 0.3，松手后基本立即恢复摔伤）
l4d_pushdrag_player_fall_protect "0.3"

// 回正模式：普通玩家按狙击瞄准键（IN_ZOOM），旁观者按 Ctrl（IN_DUCK）切换；也可用 !pdlevel 命令：1=开；0=关
l4d_pushdrag_level_key "1"

// 倒地时左键也能投掷（右键不生效时的兜底）：1=开；0=关
l4d_pushdrag_incap_attack_throw "0"

// 投掷物停下后清掉残留投掷力，避免之后踩上去被弹飞：1=开；0=关
l4d_pushdrag_throw_settle "1"

// 抓取音效开关：1=开；0=静音
l4d_pushdrag_sound "1"

// 诊断输出（排查“按键/伤害没生效”）：1=在聊天框/服务端控制台打印版本、旁观者按键位、回正切换、原点拖拽、投掷命中
l4d_pushdrag_debug "0"

// 抓到玩家时是否调用引擎 CTerrorPlayer::CancelStagger 真取消硬直：1=开（需要 gamedata/l4_pushdrag.txt）；0=只用旧的压制方案
l4d_pushdrag_cancel_stagger "1"


// ---------------------------------------------------------------------------
// 七、常用示例（需要时去掉行首的 // 即可）
// ---------------------------------------------------------------------------
//
// 恢复旧版“松手后物件保留速度”：
// l4d_pushdrag_release_stop "0"
//
// 完全禁止抓玩家：
// l4d_pushdrag_player_grab "0"
//
// 临时关闭整个插件（会立刻释放所有持握）：
// l4d_pushdrag_enable "0"
//
// 把超远抓取距离改成 500：
// l4d_pushdrag_far_grab_range "500.0"
//
// 禁止旁观者抓取 / 禁止生还者抓特感：
// l4d_pushdrag_spectator_grab "0"
// l4d_pushdrag_survivor_grab_special "0"
//
// 管理员专用（总功能 / 特感 / 旁观者）：
// l4d_pushdrag_admin_only "1"
// l4d_pushdrag_admin_only_special "1"
// l4d_pushdrag_admin_only_spectator "1"
//
// 超远抓取 / 大力投掷仅管理员：
// l4d_pushdrag_admin_only_far_grab "1"
// l4d_pushdrag_admin_only_strong_throw "1"
//
// 关闭“生还者投出物件伤害特感”：
// l4d_pushdrag_thrown_prop_damage_scale "0"
//
// 旁观者 Ctrl 无效时，用聊天命令兜底（持握物件时输入）：
// !pdlevel
// !pddebug
// !pdver
//
// 关闭“生还者投掷特感时的摔伤”：
// l4d_pushdrag_thrown_si_fall_damage_scale "0"
//
// ===========================================================================
