// ---------------------------------------------------------------------------
// Push And Drag v2.1 - config template (mirrors the Chinese cfg values)
// Copy to: <platform>\left4dead2\cfg\sourcemod\l4d_pushdrag.cfg
// This ASCII version is the fallback for the known L4D2 non-ASCII cfg issue.
//
// Keys: double tap reload = normal grab (240); +speed + double tap reload =
// long range grab (1000); while holding, right click = throw; +speed + right
// click = strong throw; single reload = drop; held player jumps = break free;
// sniper aim key = leveling mode (spectators use Ctrl instead).
// Spectators (team 1): while holding, E = throw; +speed + E = strong throw
// (right click switches the spectated player instead); F (flashlight impulse
// 100) toggles the leveling mode, Ctrl still works too.
// The witch is grabbable too: she is dragged by origin and thrown with a small
// simulated arc because she ignores velocity writes.
// Spectators can also type !pdlevel to toggle the leveling mode when the key
// does not register. Props thrown by survivors or spectators hurt special and
// common infected. Diagnostics: !pddebug toggles debug output, !pdver shows the
// version and whether CancelStagger is ready. Stagger cancel needs
// gamedata/l4_pushdrag.txt on the server.
// ---------------------------------------------------------------------------

// Master switch: 0 disables all grabbing and releases held entities, 1 enables the plugin
l4d_pushdrag_enable "1"

// Versus/scavenge survivor mode: 0=disabled, 1=objects only, 2=teammates only, 3=objects and teammates
l4d_pushdrag_versus_survivor "3"

// Versus/scavenge infected mode: 0=disabled, 1=objects only, 2=teammates only, 3=objects and teammates
l4d_pushdrag_versus_infected "2"

// Allow grabbing players at all (0/1)
l4d_pushdrag_player_grab "1"

// Allow spectators (team 1) to grab objects (0/1)
l4d_pushdrag_spectator_grab "1"

// Allow spectators to grab players and special infected too (0/1)
l4d_pushdrag_spectator_grab_players "1"

// Allow survivors to grab enemy special infected players (0/1)
l4d_pushdrag_survivor_grab_special "1"

// Only admins may grab at all (0/1)
l4d_pushdrag_admin_only "0"

// Only admins may grab enemy special infected (0/1)
l4d_pushdrag_admin_only_special "1"

// Only admins may grab while spectating (0/1)
l4d_pushdrag_admin_only_spectator "1"

// Only admins may use the +speed double tap long range grab (0/1); non admins get a normal grab
l4d_pushdrag_admin_only_far_grab "0"

// Only admins may use the +speed strong throw (0/1); non admins get a normal throw
l4d_pushdrag_admin_only_strong_throw "0"

// Block grabbing while a special infected controls the player (hunter/smoker/jockey/charger) (0/1)
l4d_pushdrag_block_when_controlled "1"

// Maximum distance (units) at which something can be grabbed
l4d_pushdrag_grab_range "240.0"

// Maximum distance (units) for the +speed double tap long range grab
l4d_pushdrag_far_grab_range "1000.0"

// Hold distance (units) for prop_* entities
l4d_pushdrag_hold_dist_object "120.0"

// Hold distance (units) for entities whose classname contains car
l4d_pushdrag_hold_dist_car "200.0"

// Hold distance (units) for weapon_* entities
l4d_pushdrag_hold_dist_weapon "50.0"

// Hold distance (units) for player entities
l4d_pushdrag_hold_dist_player "70.0"

// Hold distance (units) for every other entity (the witch also uses this)
l4d_pushdrag_hold_dist_default "100.0"

// Hold distance (units) when a survivor grabs an enemy special infected
l4d_pushdrag_hold_dist_special "180.0"

// Maximum hold time (seconds) for prop_* entities
l4d_pushdrag_hold_time_object "15.0"

// Maximum hold time (seconds) for entities whose classname contains car
l4d_pushdrag_hold_time_car "10.0"

// Maximum hold time (seconds) for weapon_* entities
l4d_pushdrag_hold_time_weapon "30.0"

// Maximum hold time (seconds) for player entities
l4d_pushdrag_hold_time_player "15.0"

// Maximum hold time (seconds) for every other entity
l4d_pushdrag_hold_time_default "10.0"

// Pull force coefficient: speed = force * distance^2
l4d_pushdrag_hold_force "0.2"

// Distance clamp (units) used by the pull force
l4d_pushdrag_hold_force_dist "100.0"

// Maximum speed (units/second) applied to a held non-player entity
l4d_pushdrag_hold_max_speed "2000.0"

// Release the hold when the entity is farther than this from the player (units)
l4d_pushdrag_break_dist "350.0"

// Zero the artificial velocity when releasing, so the entity falls normally again (0/1)
l4d_pushdrag_release_stop "1"

// Client velocity prediction multiplier used for the hold point
l4d_pushdrag_latency_comp "4.0"

// Throw force used by the +speed strong throw
l4d_pushdrag_throw_force "2000.0"

// Throw force used by a plain throw (right click, or E while spectating)
l4d_pushdrag_throw_force_attack2 "200.0"

// Minimum force added by a throw at maximum distance
l4d_pushdrag_throw_force_base "200.0"

// Distance (units) at which the throw force falls back to the base force
l4d_pushdrag_throw_falloff_dist "1000.0"

// Extra damage when a prop thrown by a survivor or spectator hits a special or common infected: damage = speed * scale (low speed throws hurt less)
l4d_pushdrag_thrown_prop_damage_scale "0.05"

// Fall damage when a survivor throws an enemy special infected: damage = throw force * scale (0 = off)
l4d_pushdrag_thrown_si_fall_damage_scale "0.02"

// Seconds allowed between the two reload taps (normal and long range grab)
l4d_pushdrag_double_tap_time "0.3"

// Write m_hPhysicsAttacker / m_hLastAttacker on thrown props (0/1). Kill credit also works through the plugin, so 0 only skips the engine fields
l4d_pushdrag_physics_attacker "1"

// Seconds a thrown prop keeps its physics attacker / kill credit (the engine window is 5 s; 0 disables the credit)
l4d_pushdrag_attacker_time "5.0"

// On release: zero angular velocity and re-sync the prop origin so it settles normally (0/1)
l4d_pushdrag_release_settle "1"

// A held player can press jump to break free (0/1)
l4d_pushdrag_player_jump_escape "1"

// Held props do not damage players until they are thrown (0/1)
l4d_pushdrag_no_held_damage "1"

// Seconds of fall damage protection after releasing a held player (0 = off, default 0.3)
l4d_pushdrag_player_fall_protect "0.3"

// Leveling mode key: IN_ZOOM (sniper aim) for players, IN_DUCK (Ctrl) for spectators; !pdlevel works too (0/1)
l4d_pushdrag_level_key "1"

// While incapped, +attack also throws the held object (fallback when attack2 is not sent) (0/1)
l4d_pushdrag_incap_attack_throw "0"

// Clear a thrown prop's velocity once it stops, so the throw force cannot launch players later (0/1)
l4d_pushdrag_throw_settle "1"

// Play the grab sound (0/1)
l4d_pushdrag_sound "1"

// Diagnostic output (loaded version, spectator buttons, level toggles, origin dragging, throw hits) (0/1)
l4d_pushdrag_debug "0"

// Cancel a grabbed client's engine stagger through CTerrorPlayer::CancelStagger (0/1); needs gamedata/l4_pushdrag.txt
l4d_pushdrag_cancel_stagger "1"
